<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Shield Outline -->
  <path d="M 256,32 C 384,80 448,112 448,240 C 448,368 352,448 256,480 C 160,448 64,368 64,240 C 64,112 128,80 256,32 Z" 
        fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="12" />

  <!-- Protective Roof Ridge -->
  <path d="M 160,220 L 256,140 L 352,220" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Flood Waves -->
  <path d="M 120,290 C 160,270 200,310 256,290 C 312,270 352,310 392,290 C 410,280 420,285 432,295 C 420,380 340,440 256,464 C 172,440 92,380 80,295 Z" 
        fill="url(#waveGrad)" opacity="0.9"/>

  <path d="M 100,340 C 150,320 200,360 256,340 C 312,320 362,360 412,340 C 400,390 340,435 256,458 C 172,435 112,390 100,340 Z" 
        fill="#0369a1" opacity="0.95"/>

  <!-- Lifebuoy / Emergency Beacon -->
  <circle cx="256" cy="225" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="8"/>
  <circle cx="256" cy="225" r="14" fill="#ffffff"/>
  <rect x="250" y="185" width="12" height="10" fill="#ffffff"/>
  <rect x="250" y="255" width="12" height="10" fill="#ffffff"/>
  <rect x="215" y="219" width="10" height="12" fill="#ffffff"/>
  <rect x="287" y="219" width="10" height="12" fill="#ffffff"/>
</svg>
